name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pytest playwright cloakbrowser httpx click rich mcp

      - name: Compile
        run: python -m compileall -q plague tests scripts benchmarks examples

      - name: Unit tests
        run: python -m pytest -m "not integration" -q
