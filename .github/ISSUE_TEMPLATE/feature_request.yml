name: Feature request
description: A new engine, solver, benchmark, or integration.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the task, not just the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - engine
        - router
        - challenge detection
        - solver
        - batch
        - MCP server
        - benchmarks
        - docs
        - other
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is a general capability, not a target-specific bypass flow.
          required: true
