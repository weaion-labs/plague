[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plague"
version = "0.1.0"
description = "Tiered browser orchestration: Lightpanda speed, CloakBrowser stealth, Chrome compatibility."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aquib Javed" }]
keywords = ["browser", "automation", "scraping", "playwright", "lightpanda", "stealth"]
dependencies = [
  "playwright>=1.50",
  "cloakbrowser>=0.5.11",
  "httpx>=0.27",
  "click>=8.1",
  "rich>=13.0",
  "mcp>=1.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
plague = "plague.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["plague"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: launches a real browser"]
